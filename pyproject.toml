[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen"
version = "0.1.0"
description = "A secure desktop password generator with an intuitive GUI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.10.2",
    "pyperclip>=1.8.2",
]

[project.scripts]
passgen = "passgen.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["passgen*"]
